<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>VIP累充充值方案</title>
<style>
:root{
  --bg:#f3f4f8; --card:#ffffff; --text:#171923; --muted:#6b7280; --line:#e5e7eb;
  --accent:#4f46e5; --accent2:#eef0fe; --accentText:#4338ca;
  --green:#059669; --green2:#e7f6ef; --amber:#b45309; --amber2:#fdf3e3;
  --red:#dc2626; --radius:16px; --shadow:0 1px 2px rgba(23,25,35,.05);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1117; --card:#181b23; --text:#e8eaf0; --muted:#9aa1ad; --line:#262a35;
    --accent:#818cf8; --accent2:#232742; --accentText:#a5b0ff;
    --green:#34d399; --green2:#123529; --amber:#fbbf24; --amber2:#3a2d10;
    --red:#f87171; --shadow:none;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.6 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  font-variant-numeric:tabular-nums}
main{max-width:560px;margin:0 auto;padding:0 14px calc(34px + env(safe-area-inset-bottom))}
header{max-width:560px;margin:0 auto;padding:20px 14px 4px;display:flex;justify-content:space-between;align-items:baseline}
h1{font-size:21px;margin:0;letter-spacing:.3px}
.sub{color:var(--muted);font-size:12.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:14px;margin:12px 0}
.lbl{font-size:13px;color:var(--muted);margin:11px 0 8px;font-weight:600}
.lbl:first-child{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;
  color:var(--text);font-size:15px;cursor:pointer;line-height:1.2;transition:.12s}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.chip.tier{font-size:14px;padding:8px 12px}
.chips.lv{display:grid;grid-template-columns:repeat(4,1fr)}
.chips.mode{display:grid;grid-template-columns:1fr 1fr}
.chips.lv .chip,.chips.mode .chip{width:100%;text-align:center;padding:8px 4px}
.chip.tier.on{font-weight:700}
.hint{font-size:13px;color:var(--muted);margin:10px 0 0}
/* 摘要 */
.hero{background:linear-gradient(135deg,var(--accent2),transparent 70%);border-color:var(--line)}
.hero .row1{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.hero .tag{font-size:13.5px;color:var(--muted)}
.hero .tag b{color:var(--text);font-size:15px}
.best{font-size:12.5px;font-weight:700;color:var(--amber);background:var(--amber2);
  border-radius:999px;padding:3px 9px;white-space:nowrap}
.big{display:flex;align-items:baseline;gap:8px;margin:8px 0 2px}
.big .r{font-size:46px;font-weight:800;letter-spacing:-1px;color:var(--accentText)}
.big .z{font-size:14px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 6px;text-align:center}
.kpi .v{font-size:19px;font-weight:700}
.kpi .l{font-size:12.5px;color:var(--muted);margin-top:1px}
.gift{font-size:13px;color:var(--muted);margin:10px 0 0}
.notbest{font-size:12px;color:var(--amber);margin:8px 0 0}
.warn{font-size:12.5px;color:var(--red);margin:8px 0 0}
/* 步骤 */
ul.steps{list-style:none;margin:12px 0;padding:0}
.step{display:grid;grid-template-columns:38px 1fr auto;gap:11px;background:var(--card);
  border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow)}
.step.cross{border-color:var(--green);background:linear-gradient(135deg,var(--green2),var(--card) 55%)}
.lcol{display:flex;flex-direction:column;align-items:center;gap:5px}
.n{width:29px;height:29px;border-radius:50%;background:var(--accent2);color:var(--accentText);
  display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800}
.d{font-size:11.5px;color:var(--muted);white-space:nowrap}
.t1{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.t1 b{font-size:17px}
.badge{font-size:12px;font-weight:700;border-radius:6px;padding:2px 8px;white-space:nowrap}
.badge.月券{color:var(--accentText);background:var(--accent2)}
.badge.福利券{color:var(--green);background:var(--green2)}
.badge.全价{color:var(--muted);background:var(--bg)}
.xmark{font-size:12px;font-weight:800;color:var(--green);border:1px solid var(--green);
  border-radius:999px;padding:1px 8px;white-space:nowrap}
.t2{font-size:15px;color:var(--text);margin-top:2px}
.t3{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.55}
.rcol{text-align:right;display:flex;flex-direction:column;justify-content:center}
.rcol .p{font-size:18px;font-weight:800}
.rcol .cum{font-size:12px;color:var(--muted);margin-top:1px;white-space:nowrap}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:4px 14px 0;font-size:14px;color:var(--muted)}
.total b{font-size:16px;color:var(--text)}
.foot{font-size:12.5px;color:var(--muted);line-height:1.75;margin:16px 2px 0}
.foot b{color:var(--text)}
/* 注意事项弹窗 */
.mask{position:fixed;inset:0;background:rgba(10,12,18,.55);backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.mask.hide{display:none}
.modal{background:var(--card);border:1px solid var(--line);border-radius:20px;max-width:400px;width:100%;
  max-height:82vh;overflow:auto;padding:20px 18px 16px;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.modal h2{font-size:19px;margin:0 0 13px;text-align:center}
.notice{list-style:none;margin:0 0 4px;padding:0}
.notice li{font-size:15px;line-height:1.75;margin:0 0 11px}
.banner{display:block;width:100%;border-radius:12px;margin:0 0 20px;border:1px solid var(--line)}
.hl{background:var(--amber2);color:var(--amber);font-weight:700;border-radius:5px;padding:1px 4px}
.disclaim{font-size:12.5px;color:var(--muted);line-height:1.75;border-top:1px dashed var(--line);
  padding-top:10px;margin:2px 0 0}
.btn{display:block;width:100%;margin-top:14px;padding:13px;border:none;border-radius:13px;
  background:var(--accent);color:#fff;font-size:16.5px;font-weight:700;cursor:pointer;transition:.15s}
.btn:disabled{background:var(--line);color:var(--muted);cursor:not-allowed}
.btn:not(:disabled):active{transform:scale(.97)}
</style>
</head>
<body>
<header>
  <h1>VIP累充充值方案</h1>
  <div class="sub">2026-09-30 ~ 10-02</div>
</header>
<main>
  <section class="card">
    <div class="lbl">会员等级</div>
    <div class="chips lv" id="lv"></div>
    <div class="lbl">版本</div>
    <div class="chips mode" id="mode"></div>
    <div class="lbl">累充档位(✨ 推荐 · ⭐ 纯折扣最优)</div>
    <div class="chips" id="tiers"></div>
    <p class="hint" id="hint"></p>
  </section>
  <section class="card hero" id="sum"></section>
  <ul class="steps" id="steps"></ul>
  <p class="foot" id="foot"></p>
</main>

const PLANS = DATA.plans, META = DATA.meta;
const st = {lv:"V6", mode:"single", tier:null};
const el = id => document.getElementById(id);
const plan = () => PLANS[st.lv][st.mode];

function bindChips(node, attr, fn){
  [...node.children].forEach(b => b.onclick = () => { fn(b.dataset.v); refresh(); });
}
function renderLevels(){
  el("lv").innerHTML = Object.keys(PLANS).map(v =>
    `<button class="chip${v===st.lv?" on":""}" data-v="${v}">${v}</button>`).join("");
  bindChips(el("lv"), 0, v => { st.lv = v; st.tier = null; });
}
function renderModes(){
  el("mode").innerHTML = [["single","单月版"],["double","双月版"]].map(([v,l]) =>
    `<button class="chip${v===st.mode?" on":""}" data-v="${v}">${l}</button>`).join("");
  bindChips(el("mode"), 0, v => { st.mode = v; st.tier = null; });
}
function renderTiers(){
  const p = plan();
  if (st.tier == null || !p.tiers[String(st.tier)]) st.tier = +p.rec;
  el("tiers").innerHTML = META.targets.map(T => {
    const t = p.tiers[String(T)];
    const mark = String(T) === p.rec ? "✨" : (String(T) === p.best ? "⭐" : "");
    return `<button class="chip tier${T===st.tier?" on":""}" data-v="${T}">${mark}${T} · ${t.r.toFixed(1)}%</button>`;
  }).join("");
  bindChips(el("tiers"), 0, v => { st.tier = +v; });
}
function unlocked(prev, cum){
  const cnt = {};
  for (const [th, ms, off] of META.ev)
    if (prev < th && th <= cum){
      const k = `满${ms}减${off}`;
      cnt[k] = (cnt[k] || 0) + 1;
    }
  return Object.entries(cnt).map(([k, v]) => v > 1 ? `${k}×${v}` : k);
}
function stepExtra(s){
  const cross = (s.note || "").includes("←累计过");
  let note = (s.note || "")
    .replace(/全价补足\(6元档×(\d+)\)/, "垫 6元档×$1")
    .replace(/解锁门槛(\d+)元/, "$1线解锁")
    .replace(/;?←累计过\d+线/, "");
  const parts = [];
  if (note) parts.push(note);
  const unl = unlocked(s.cum - s.p, s.cum);
  if (unl.length) parts.push("→解锁 " + unl.join("、"));
  return {cross, parts};
}
function render(){
  const p = plan(), t = p.tiers[String(st.tier)];
  const isRec = String(st.tier) === p.rec, isBest = String(st.tier) === p.best;
  const modeName = st.mode === "single" ? "单月版" : "双月版";
  el("hint").textContent = st.mode === "double"
    ? "双月版 = 9月整套未用 + 10月新券：9月的单必须 9/30 当天下完，其余 10/1 起下"
    : "单月版 = 只用当月一套券：任一天内下完即可";
  el("sum").innerHTML = `
    <div class="row1">
      <span class="tag"><b>${st.lv}</b> · ${modeName} · <b>${st.tier}档</b></span>
      ${isRec ? `<span class="best">✨ 推荐档 · 性价比之选</span>` : (isBest ? `<span class="best">⭐ 最优档 · 折扣最低</span>` : "")}
    </div>
    <div class="big"><span class="r">${t.r.toFixed(1)}%</span><span class="z">实付/面值 ≈ ${(t.r/10).toFixed(2)} 折</span></div>
    <div class="kpis">
      <div class="kpi"><div class="v">${t.pay}</div><div class="l">实付</div></div>
      <div class="kpi"><div class="v">${t.face}</div><div class="l">得面值</div></div>
      <div class="kpi"><div class="v">${t.steps.length}</div><div class="l">下单数</div></div>
    </div>
    <p class="gift">该档另送礼包价值 ${t.gift} 元(未计入折扣)${isRec ? "" : ` · ✨推荐：${p.rec}档 ${p.tiers[p.rec].r.toFixed(1)}%`}</p>
    ${t.warn && t.warn.length ? `<p class="warn">⚠ ${t.warn.join(";")}</p>` : ""}`;
  el("steps").innerHTML = t.steps.map(s => {
    const {cross, parts} = stepExtra(s);
    return `<li class="step${cross ? " cross" : ""}">
      <div class="lcol"><div class="n">${s.n}</div>${s.d ? `<div class="d">${s.d}</div>` : ""}</div>
      <div>
        <div class="t1"><b>${s.t}元档</b><span class="badge ${s.k}">${s.k}</span>${cross ? `<span class="xmark">过${st.tier}线</span>` : ""}</div>
        <div class="t2">${s.c}</div>
        ${parts.length ? `<div class="t3">${parts.join(" · ")}</div>` : ""}
      </div>
      <div class="rcol"><div class="p">${s.p}</div><div class="cum">累计 ${s.cum}</div></div>
    </li>`;
  }).join("") + `<div class="total"><span>合计</span><span><b>${t.pay}</b> / ${t.face} = ${t.r.toFixed(2)}%</span></div>`;
  el("foot").innerHTML = `<b>执行口诀</b>：大单先行 → 大额福利券(30-29/68-67/158-157/328-327/648-400)解锁后立即用小档收割 → 小月券凑线 → 福利券收尾。<b>支付宝每单自动用减免额最大的券</b>，已按此排出安全序，请勿改序。<br>口径：福利券购买计入累计实付;月券每档一张、每单限一券;9月券仅 9/30 有效，福利券 ≤10/2 23:59。<br>由 vip_levels_export.py 穷举求解生成，常量仅对本期活动有效。`;
}
