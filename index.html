<title>仙兽降福</title>
<style>
  :root{
    --bg:#f2f4f8; --card:#ffffff; --ink:#1a2233; --muted:#6b7385; --line:#e5e8f0;
    --accent:#4f6ef7; --accent2:#7c5cf0;
    --in-bg:#e9f1fe; --in-bd:#9ec3e8; --in-ink:#1d3f7a;
    --chip-bg:#eef0f4; --chip-ink:#3c4356;
    --red:#d83236; --red-bg:#fdecec; --red-ink:#b4191d;
    --ok:#1f8a5d; --ok-bg:#e9f9f0; --ok-bd:#bce8cd; --ok-ink:#116040;
    --shadow:0 1px 2px rgba(16,24,40,.05), 0 10px 28px -14px rgba(16,24,40,.16);
    --radius:16px;
    --gold:#f2a90c; --gold-bd:#c98708; --gold-ink:#5c3f00;
    --green:#79a83e; --green-bd:#5d8a2c; --green-ink:#26400c;
    --cyan:#2eb3a0; --cyan-bd:#1f8d7d; --cyan-ink:#04352e;
    --hot:#ff7a00;
  }

    :root:not([data-theme="light"]){
      --bg:#0f131c; --card:#171c28; --ink:#e8ebf4; --muted:#98a0b3; --line:#262d3d;

      --chip-bg:#202638; --chip-ink:#aab3c8;
      --red:#ff7073; --red-bg:#3a2023; --red-ink:#ff9b9d;
      --ok:#4cc38a; --ok-bg:#14301f; --ok-bd:#1f5e40; --ok-ink:#7fe0b0;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.6);
    }
  }

    --bg:#0f131c; --card:#171c28; --ink:#e8ebf4; --muted:#98a0b3; --line:#262d3d;
    --in-bg:#1c2a47; --in-bd:#3d5c9e; --in-ink:#bcd2f7;
    --chip-bg:#202638; --chip-ink:#aab3c8;
    --red:#ff7073; --red-bg:#3a2023; --red-ink:#ff9b9d;
    --ok:#4cc38a; --ok-bg:#14301f; --ok-bd:#1f5e40; --ok-ink:#7fe0b0;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.6);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html{ touch-action:manipulation; }

    margin:0; padding:14px 14px calc(28px + env(safe-area-inset-bottom));
    background:var(--bg); color:var(--ink);
    font:15px/1.5 -apple-system, "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  }

  h1{ font-size:19px; margin:0; flex:1; letter-spacing:.5px; }
  .iconbtn{
    border:1px solid var(--line); background:var(--card); color:var(--muted);
    font:600 12px/1 inherit; padding:8px 10px; border-radius:10px; cursor:pointer; min-height:34px;
  }
  main{ max-width:680px; margin:0 auto; display:grid; gap:12px; }
  @media (min-width:760px){
    main{ grid-template-columns:1fr 1fr; align-items:start; }
    #card-board{ grid-row:span 2; }
  }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
         box-shadow:var(--shadow); padding:14px 14px 16px; }
  h2{ font-size:14.5px; margin:0 0 10px; display:flex; align-items:center; gap:8px; }
  h2::before{ content:""; width:4px; height:16px; border-radius:2px;
              background:linear-gradient(180deg, var(--accent), var(--accent2)); }
  .chips{ display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
  .chip{ background:var(--chip-bg); color:var(--chip-ink); border-radius:12px;
         padding:8px 12px; font-size:13px; display:flex; justify-content:space-between; gap:10px; align-items:baseline; }
  .chip b{ font-size:15px; font-variant-numeric:tabular-nums; }
  .chip.warn{ background:var(--red-bg); border:1px solid var(--red); }
  .chip.warn b{ color:var(--red); font-weight:800; }

  /* 棋盘 */
  .board{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:12px; }
  .cell{ position:relative; aspect-ratio:1/ .92; border-radius:12px; border:2px solid var(--line);
    background:var(--card); cursor:pointer; display:flex; flex-direction:column;
    align-items:center; justify-content:center; transition:transform .06s, box-shadow .15s;
    user-select:none; -webkit-user-select:none; }
  .cell:active{ transform:scale(.96); }
  .cell .no{ position:absolute; top:5px; left:8px; font-size:11px; color:var(--muted); font-weight:600; }
  .cell .pct{ font-size:17px; font-weight:700; font-variant-numeric:tabular-nums; margin-top:6px; }
  .cell.sel{ outline:3px solid var(--accent); outline-offset:2px; }
  .cell.hot{ border-color:var(--hot); box-shadow:0 0 0 3px rgba(255,122,0,.25), 0 2px 10px rgba(255,122,0,.28); }
  .cell.hot::after{ content:"★"; position:absolute; top:4px; right:8px; color:var(--hot); font-size:13px; }
  .cell.dead{ opacity:.45; }
  .cell.k-J{ background:var(--gold); border-color:var(--gold-bd); }
  .cell.k-J .pct{ color:var(--gold-ink); } .cell.k-J .no{ color:#8a6206; }
  .cell.k-L{ background:var(--green); border-color:var(--green-bd); }
  .cell.k-L .no,.cell.k-L .pct{ color:var(--green-ink); }
  .cell.k-Q{ background:var(--cyan); border-color:var(--cyan-bd); }
  .cell.k-Q .no,.cell.k-Q .pct{ color:var(--cyan-ink); }

  .legend{ display:flex; flex-wrap:wrap; gap:6px 14px; font-size:12px; color:var(--muted); margin-top:10px; }
  .legend i{ display:inline-block; width:12px; height:12px; border-radius:3px; margin-right:4px; vertical-align:-1px; }
  .btns-top{ display:flex; gap:8px; margin-top:12px; }
  .btn-ghost{ background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px 14px;
              font-size:13px; color:var(--muted); cursor:pointer; min-height:38px; }

  /* 建议 */
  .advice{ font-size:14px; }
  .advice .pill{ display:inline-block; background:var(--in-bg); color:var(--in-ink); border:1px solid var(--in-bd);
    border-radius:999px; padding:1px 10px; margin:0 2px; font-weight:700; }
  .advice .pill.hit{ background:#fdf2d0; border-color:#ecd28a; color:#7a5800; }
  table.stats{ width:100%; border-collapse:collapse; font-size:13px; margin-top:8px; }
  table.stats th, table.stats td{ padding:4px 5px; text-align:right; border-bottom:1px solid var(--line); }
  table.stats th:first-child, table.stats td:first-child{ text-align:left; }
  table.stats tr.best td{ background:var(--in-bg); font-weight:700; }

  .banner{ border-radius:10px; padding:10px 12px; font-size:14px; margin:0 0 12px; display:none; }
  .banner.ok{ display:block; background:var(--ok-bg); border:1px solid var(--ok-bd); color:var(--ok-ink); }
  .banner.err{ display:block; background:var(--red-bg); border:1px solid var(--red); color:var(--red-ink); }
  .banner.info{ display:block; background:var(--in-bg); border:1px solid var(--in-bd); color:var(--in-ink); }

  /* 历史条目 */
  .hchips{ display:flex; flex-wrap:wrap; gap:8px; }
  .hchip{ background:var(--chip-bg); border:1px solid var(--line); color:var(--chip-ink);
          border-radius:999px; padding:3px 6px 3px 12px; font-size:13px; }
  .hchip button{ border:none; background:none; color:var(--muted); cursor:pointer; font-size:14px; padding:0 4px; }
  .hchip i{ display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:-1px; }

  /* 档案 */
  .arch-list{ display:flex; flex-direction:column; gap:8px; margin-top:10px; }
  .arch-item{ display:flex; align-items:center; gap:10px; padding:6px 8px; border:1px solid var(--line); border-radius:10px; }
  .arch-item .meta{ font-size:12px; color:var(--muted); }
  .arch-item .ops{ margin-left:auto; display:flex; gap:6px; }
  .arch-ops{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px; }
  .cal-toggle{ font-size:13px; color:var(--ink); display:flex; align-items:center; gap:6px; cursor:pointer; }
  .cal-toggle input{ width:16px; height:16px; accent-color:var(--accent); }
  .btn-mini{ background:var(--in-bg); border:1px solid var(--in-bd); border-radius:8px; padding:5px 12px;
             font-size:12px; color:var(--in-ink); cursor:pointer; min-height:32px; }
  .mini{ display:grid; grid-template-columns:repeat(4,14px); grid-auto-rows:14px; gap:2px; }
  .mini b{ border-radius:3px; }
  .mini .mJ{ background:var(--gold); } .mini .mL{ background:var(--green); }
  .mini .mQ{ background:var(--cyan); } .mini .mW{ background:var(--card); border:1px dashed #c3c8cf; }
  .mini.small{ grid-template-columns:repeat(4,11px); grid-auto-rows:11px; gap:1px; }
  details{ margin-top:2px; }
  summary{ cursor:pointer; font-size:13px; color:var(--muted); }
  .minis{ display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }


  /* toast */
  .toast{
    position:fixed; left:50%; bottom:calc(84px + env(safe-area-inset-bottom));
    transform:translateX(-50%) translateY(8px);
    background:var(--ink); color:var(--bg);
    padding:10px 18px; border-radius:12px; font-size:13.5px; z-index:40;
    opacity:0; pointer-events:none; transition:opacity .25s, transform .25s;
    box-shadow:var(--shadow); max-width:80%;
  }
  .toast.on{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* 弹层（底部动作板 / 居中确认） */
  .sheet{ position:fixed; inset:0; z-index:30; }
  .sheet[hidden]{ display:none; }
  .sheet-mask{ position:absolute; inset:0; background:rgba(15,19,28,.45); opacity:0; transition:opacity .25s; }
  .sheet-panel{
    position:absolute; left:0; right:0; bottom:0; margin:0 auto; max-width:520px;
    background:var(--card); border-radius:22px 22px 0 0;
    padding:8px 14px calc(14px + env(safe-area-inset-bottom));
    transform:translateY(105%); transition:transform .3s cubic-bezier(.32,.72,.33,1);
    box-shadow:0 -10px 40px rgba(0,0,0,.28);
  }
  .sheet.on .sheet-mask{ opacity:1; }
  .sheet.on .sheet-panel{ transform:translateY(0); }
  .sheet-panel.center{
    left:50%; right:auto; bottom:auto; top:50%; width:calc(100% - 64px); max-width:300px;
    border-radius:18px; padding:18px 16px 14px;
    transform:translate(-50%, -50%) scale(1.06); opacity:0;
    transition:transform .22s ease, opacity .22s ease;
  }
  .sheet.on .sheet-panel.center{ transform:translate(-50%, -50%) scale(1); opacity:1; }
  .confirm-title{ text-align:center; font-size:16px; font-weight:700; }
  .confirm-msg{ text-align:center; color:var(--muted); font-size:13.5px; margin:6px 0 14px; }
  .confirm-btns{ display:flex; gap:10px; }
  .cbtn{ flex:1; border:none; background:var(--chip-bg); color:var(--ink);
         font:600 15px/1 inherit; padding:12px 0; border-radius:12px; cursor:pointer; min-height:44px; }
  .cbtn:active{ opacity:.7; }
  .cbtn.strong{ background:var(--red-bg); color:var(--red-ink); border:1px solid var(--red); }
  .cbtn:disabled{ opacity:.55; cursor:not-allowed; }
  .intro-banner{ display:block; width:100%; border-radius:12px; border:1px solid var(--line); margin:0 0 12px; }
  .disclaim{ font-size:13.5px; color:var(--muted); line-height:1.8; text-align:left;
             border-top:1px dashed var(--line); padding-top:10px; margin:0; }
  .sheet-panel.center.intro{ width:calc(100% - 44px); max-width:420px; padding:20px 18px 16px; }
  .intro .confirm-btns{ margin-top:18px; }

  /* 选色动作板 */
  .sheet-head{ display:flex; align-items:center; justify-content:space-between; padding:6px 2px 8px; }
  .sheet-title{ font-size:14px; font-weight:600; }
  .sheet-btn{ border:none; background:none; color:var(--accent); font:600 15px/1 inherit;
              padding:12px 8px; cursor:pointer; }
  .colorgrid{ display:flex; gap:10px; padding:6px 0 10px; }
  .colorbtn{ flex:1; border:none; border-radius:14px; font:700 17px/1 inherit; padding:16px 0;
             cursor:pointer; min-height:52px; }
  .colorbtn:active{ transform:scale(.96); }
  .colorbtn.cJ{ background:var(--gold); color:var(--gold-ink); }
  .colorbtn.cL{ background:var(--green); color:#fff; }
  .colorbtn.cQ{ background:var(--cyan); color:#fff; }
  .clearbtn{ width:100%; border:none; background:var(--chip-bg); color:var(--muted);
             font:600 14px/1 inherit; padding:12px 0; border-radius:12px; cursor:pointer; min-height:44px; }
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="logo"></span>
    <h1>仙兽降福</h1>
    <button class="iconbtn" id="themeBtn">主题·跟随</button>
    <button class="iconbtn" id="resetAsk">重置</button>
  </div>
</header>

<main>
  <div id="bannerWrap" style="grid-column:1/-1">
    <div id="bannerMain" class="banner ok"></div>
    <div id="bannerErr" class="banner err"></div>
  </div>

  <section class="card" id="card-board">
    <h2>棋盘与状态</h2>
    <div class="chips">
      <div class="chip"><span>相符局面</span><b><span id="nLeft">138</span>/138</b></div>
      <div class="chip" id="stGold"><span>金</span><b><span id="nGold">0</span>/3</b></div>
      <div class="chip" id="stGreen"><span>绿</span><b><span id="nGreen">0</span>/2</b></div>
      <div class="chip" id="stCyan"><span>蓝</span><b><span id="nCyan">0</span>/2</b></div>
    </div>
    <div id="board" class="board"></div>
    <div class="legend">
      <span><i style="background:var(--gold)"></i>金</span>
      <span><i style="background:var(--green)"></i>绿</span>
      <span><i style="background:var(--cyan)"></i>蓝</span>
      <span><i style="background:var(--card);box-shadow:inset 0 0 0 2px var(--hot)"></i>推荐点击</span>
    </div>
    <div class="btns-top">
      <button class="btn-ghost" onclick="undoLast()">撤销上一步</button>
    </div>
  </section>

  <section class="card advice">
    <h2>下一步建议</h2>
    <div id="adviceLine">正在计算……</div>
    <details>
      <summary>展开：各格点击价值一览（当前状态）</summary>
      <table class="stats" id="statsTable"></table>
    </details>
  </section>

  <section class="card" id="historyCard" style="display:none">
    <h2>本局已知</h2>
    <div style="font-size:12px;color:var(--muted);margin-bottom:8px">点条目可单步撤销</div>
    <div class="hchips" id="chips"></div>
  </section>

  <section class="card">
    <h2>当前相符的局面</h2>
    <details>
      <summary><span id="nLeft2">138</span> 种，按可能性排序</summary>
      <div class="minis" id="minis"></div>
    </details>
  </section>

  <section class="card">
    <h2>跨期档案</h2>
    <div class="arch-ops">
      <label class="cal-toggle"><input type="checkbox" id="calChk">用我的档案校准概率</label>
      <button class="btn-mini" id="exportBtn">导出 JSON</button>
    </div>
    <details open id="archDetails">
      <summary>📦 共 <span id="nArch">0</span> 局</summary>
      <div class="arch-list" id="archList"></div>
      <div style="font-size:12px;color:var(--muted);margin-top:8px" id="calNote"></div>
    </details>
  </section>
</main>

<div class="toast" id="toast"></div>

<!-- 选色动作板 -->
<div class="sheet" id="colorSheet" hidden>
  <div class="sheet-mask" id="colorMask"></div>
  <div class="sheet-panel">
    <div class="sheet-head">
      <button type="button" class="sheet-btn" id="colorCancel">取消</button>
      <div class="sheet-title">格子 <b id="selNo">-</b> 翻开后的颜色</div>
      <span style="width:44px"></span>
    </div>
    <div class="colorgrid">
      <button class="colorbtn cJ" onclick="pickColor('J')">金</button>
      <button class="colorbtn cL" onclick="pickColor('L')">绿</button>
      <button class="colorbtn cQ" onclick="pickColor('Q')">蓝</button>
    </div>
    <button class="clearbtn" id="clearCellBtn" style="display:none">清除该格已知（当作未翻开）</button>
  </div>
</div>

<!-- 重置确认 -->
<div class="sheet" id="confirmSheet" hidden>
  <div class="sheet-mask" id="confirmMask"></div>
  <div class="sheet-panel center">
    <div class="confirm-title">开始新一局</div>
    <div class="confirm-msg">清空本局已翻开的颜色与计数？跨期档案会保留。</div>
    <div class="confirm-btns">
      <button type="button" class="cbtn" id="confirmCancel">取消</button>
      <button type="button" class="cbtn strong" id="confirmOk">确认重置</button>
    </div>
  </div>
</div>

// ---------- 弹层 / toast ----------
function openSheet(el){ el.hidden = false; requestAnimationFrame(() => el.classList.add("on")); }
function closeSheet(el){ el.classList.remove("on"); setTimeout(() => { el.hidden = true; }, 240); }

// ---------- 主题（跟随／亮／暗） ----------
const themeModes = [null, "light", "dark"];
const themeNames = {"null": "主题·跟随", "light": "主题·亮", "dark": "主题·暗"};
function themeIdx(){
  const cur = localStorage.getItem(THEME_KEY);
  return cur === "light" ? 1 : cur === "dark" ? 2 : 0;
}
function applyTheme(){
  const mode = themeModes[themeIdx()];
  if (mode) document.documentElement.setAttribute("data-theme", mode);
  else document.documentElement.removeAttribute("data-theme");
  $("themeBtn").textContent = themeNames[String(mode)];
}
$("themeBtn").addEventListener("click", () => {
  localStorage.setItem(THEME_KEY, themeModes[(themeIdx() + 1) % 3]);
  applyTheme();
});

// ---------- 选色动作板 ----------
function openColorSheet(){
  $("selNo").textContent = selected + 1;
  $("clearCellBtn").style.display = known[selected] ? "" : "none";
  openSheet($("colorSheet"));
}
function closeColorSheet(){ closeSheet($("colorSheet")); selected = null; render(); }
$("colorCancel").addEventListener("click", closeColorSheet);
$("colorMask").addEventListener("click", closeColorSheet);
$("clearCellBtn").addEventListener("click", () => {
  if (selected !== null) removeStep(selected);
  closeColorSheet();
});
function pickColor(c){
  if (selected === null) return;
  feedback(c);
  closeSheet($("colorSheet"));
}

// ---------- 档案 ----------
function loadArchive(){
  try { archive = JSON.parse(localStorage.getItem(ARCH_KEY) || "[]"); } catch (e) { archive = []; }
  if (!Array.isArray(archive)) archive = [];
}
function saveArchive(){
  try { localStorage.setItem(ARCH_KEY, JSON.stringify(archive)); } catch (e) {}
}
function archiveKnown(){
  const k = {};
  for (const [i, e] of Object.entries(known)) k[i] = e.c;
  if (!Object.keys(k).length) return false;
  if (archive.some(a => JSON.stringify(a.k) === JSON.stringify(k))) return false;
  const d = new Date(), pad = n => String(n).padStart(2, "0");
  archive.unshift({d: `${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`, k});
  saveArchive();
  return true;
}

// ---------- 档案校准：把每局档案当作一条额外游玩记录，与攻略图 138 局合并成先验 ----------
let calOn = false;
function loadCal(){ try { calOn = localStorage.getItem("ssby-cal") === "1"; } catch (e) {} $("calChk").checked = calOn; }
function baseWeights(){
  const w = BOARDS.map(() => 1);
  if (!calOn) return w;
  for (const a of archive) {
    // 该局在各盘面上的似然（同色 1、未知按基础比例、冲突 0），归一后按责任度加票
    const L = BOARDS.map(b => {
      let p = 1;
      for (const [i, c] of Object.entries(a.k)) { p *= LKH[c][b[i]]; if (p === 0) break; }
      return p;
    });
    const s = L.reduce((x, y) => x + y, 0);
    if (s <= 0) continue;                       // 与全部盘面冲突的异常记录，跳过
    L.forEach((p, k) => { w[k] += p / s; });
  }
  return w;
}

// ---------- 导出 ----------
function exportArchive(){
  if (!archive.length) { toast("还没有档案可导出"); return; }
  const d = new Date(), pad = n => String(n).padStart(2, "0");
  const data = {应用: "仙兽降福", 导出时间: d.toISOString(), 局数: archive.length, 档案: archive};
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 1)], {type: "application/json"}));
  a.download = `仙兽降福档案-${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  toast(`已导出 ${archive.length} 局档案`);
}

// ---------- 推断 ----------
function weights(){
  let w = baseWeights();
  for (const [i, e] of Object.entries(known)) {
    const row = LKH[e.c];
    w = w.map((x, k) => x * row[BOARDS[k][i]]);
  }
  return w;
}
function entropy(w){
  const t = w.reduce((a, b) => a + b, 0);
  if (t <= 0) return 0;
  return -w.reduce((a, x) => a + (x > 0 ? x / t * log2(x / t) : 0), 0);
}
function cellColorProbs(w){
  const t = w.reduce((a, b) => a + b, 0) || 1;
  return Array.from({length:12}, (_, i) => {
    let pJ = 0, pL = 0, pQ = 0;
    w.forEach((x, k) => {
      const m = BOARDS[k][i];
      if (m === 'J') pJ += x;
      else if (m === 'L') pL += x;
      else if (m === 'Q') pQ += x;
      else { pL += x * P_GREEN; pQ += x * P_CYAN; }
    });
    return {pJ: pJ / t, pL: pL / t, pQ: pQ / t};
  });
}
function entropyGains(w, probs){
  const base = entropy(w);
  return Array.from({length:12}, (_, i) => {
    if (i in known) return null;
    let e = 0;
    for (const [c, p] of [["J", probs[i].pJ], ["L", probs[i].pL], ["Q", probs[i].pQ]]) {
      if (p <= 0) continue;
      const row = LKH[c];
      const w2 = w.map((x, k) => x * row[BOARDS[k][i]]);
      e += p * entropy(w2);
    }
    return base - e;
  });
}
function recommend(probs, gains, sg, sc){
  const cands = Array.from({length:12}, (_, i) => i).filter(i => !(i in known));
  if (!cands.length) return null;
  const certain = cands.filter(i => probs[i].pJ > 1 - 1e-9);
  if (certain.length) return {list: certain, rule: "certain"};
  const keyMax = (arr, key) => {
    const m = Math.max(...arr.map(i => key(i)));
    return arr.filter(i => Math.abs(key(i) - m) < 1e-9);
  };
  if (sg >= 2 && sc < 2) {
    const safe = cands.filter(i => probs[i].pL < 1e-9);
    if (safe.length) return {list: keyMax(safe, i => probs[i].pJ), rule: "safeL"};
    const m = Math.min(...cands.map(i => probs[i].pL));
    return {list: cands.filter(i => Math.abs(probs[i].pL - m) < 1e-9), rule: "gambleL"};
  }
  if (sc >= 2 && sg < 2) {
    const safe = cands.filter(i => probs[i].pQ < 1e-9);
    if (safe.length) return {list: keyMax(safe, i => probs[i].pJ), rule: "safeQ"};
    const m = Math.min(...cands.map(i => probs[i].pQ));
    return {list: cands.filter(i => Math.abs(probs[i].pQ - m) < 1e-9), rule: "gambleQ"};
  }
  if (sg >= 2 && sc >= 2) {
    return {list: keyMax(cands, i => probs[i].pJ), rule: "allin"};
  }
  const byP = keyMax(cands, i => probs[i].pJ);
  if (byP.length > 1) {
    const m = Math.max(...byP.map(i => gains[i]));
    return {list: byP.filter(i => Math.abs(gains[i] - m) < 1e-9), rule: "pj"};
  }
  return {list: byP, rule: "pj"};
}

const miniHTML = k => `<div class="mini small">${Array.from({length:12}, (_, i) =>
  `<b class="m${k[i] || 'W'}"></b>`).join("")}</div>`;

function render(){
  const w = weights();
  const total = w.reduce((a, b) => a + b, 0);
  const alive = w.map((x, k) => x > 1e-12 ? k : -1).filter(k => k >= 0);
  const conflict = total <= 0;
  const probs = cellColorProbs(w);
  const gains = entropyGains(w, probs);

  const clickEntries = Object.values(known).filter(e => e.src === "click");
  const sg = clickEntries.filter(e => e.c === 'L').length;
  const sc = clickEntries.filter(e => e.c === 'Q').length;
  const ng = clickEntries.filter(e => e.c === 'J').length;
  const failed = sg >= 3 || sc >= 3;
  const won = ng >= 3;
  const over = failed || won;

  $("nLeft").textContent = alive.length; $("nLeft2").textContent = alive.length;
  $("nGold").textContent = ng; $("nGreen").textContent = sg; $("nCyan").textContent = sc;
  $("stGreen").className = "chip" + (sg >= 2 ? " warn" : "");
  $("stCyan").className = "chip" + (sc >= 2 ? " warn" : "");

  if (over && !runSaved) { archiveKnown(); runSaved = true; }

  const rec = (over || conflict) ? null : recommend(probs, gains, sg, sc);
  const recSet = new Set(rec ? rec.list : []);

  const board = $("board");
  board.innerHTML = "";
  for (let i = 0; i < 12; i++) {
    const d = document.createElement("div");
    const e = known[i];
    d.className = "cell" + (e ? " k-" + e.c : "");
    if (recSet.has(i)) d.classList.add("hot");
    if (!e && !conflict && !over && probs[i].pJ < 1e-9) d.classList.add("dead");
    if (selected === i) d.classList.add("sel");
    const no = `<span class="no">${i + 1}</span>`;
    if (e) {
      d.innerHTML = no + `<span class="pct">${NAMES[e.c]}</span>`;
    } else if (conflict) {
      d.innerHTML = no + `<span class="pct">–</span>`;
    } else {
      d.innerHTML = no + `<span class="pct">${Math.round(probs[i].pJ * 100)}%</span>`;
    }
    d.onclick = () => { selected = (selected === i ? null : i); render(); if (selected !== null) openColorSheet(); };
    board.appendChild(d);
  }

  const fmt = a => a.map(x => x + 1).join("、") + " 号";
  let line;
  if (conflict) {
    line = `当前反馈与全部 138 种局面矛盾，请核对最近一次反馈颜色。`;
  } else if (won) {
    line = `已找齐 3 金，本局通关！`;
  } else if (failed) {
    line = `本次抽奖结束：开到了第 3 个${sg >= 3 ? "绿" : "蓝"}。已知颜色已存入跨期档案，点「重置」开始新一局。`;
  } else if (!rec) {
    line = `12 格均已翻开，无下一步建议。`;
  } else {
    const r = rec.list[0], p = probs[r];
    if (rec.rule === "certain") {
      line = `<b>${fmt(rec.list)}</b>必为金，直接点它（零风险）。`;
    } else if (rec.rule === "safeL") {
      line = `绿已开 ${sg} 次，再开到绿即结束 → 只在安全格（绿概率 0）里选：推荐 <span class="pill">${fmt(rec.list)}</span>（金 ${(p.pJ * 100).toFixed(1)}%，蓝 ${(p.pQ * 100).toFixed(1)}%）。`;
    } else if (rec.rule === "gambleL") {
      line = `绿已开 ${sg} 次且已无安全格，只能赌：推荐绿概率最低的 <span class="pill">${fmt(rec.list)}</span>（绿 ${(p.pL * 100).toFixed(1)}%，金 ${(p.pJ * 100).toFixed(1)}%）。`;
    } else if (rec.rule === "safeQ") {
      line = `蓝已开 ${sc} 次，再开到蓝即结束 → 只在安全格（蓝概率 0）里选：推荐 <span class="pill">${fmt(rec.list)}</span>（金 ${(p.pJ * 100).toFixed(1)}%，绿 ${(p.pL * 100).toFixed(1)}%）。`;
    } else if (rec.rule === "gambleQ") {
      line = `蓝已开 ${sc} 次且已无安全格，只能赌：推荐蓝概率最低的 <span class="pill">${fmt(rec.list)}</span>（蓝 ${(p.pQ * 100).toFixed(1)}%，金 ${(p.pJ * 100).toFixed(1)}%）。`;
    } else if (rec.rule === "allin") {
      line = `绿蓝均已 2 次，非金即败 → 推荐金概率最高的 <span class="pill">${fmt(rec.list)}</span>（${(p.pJ * 100).toFixed(1)}%）。`;
    } else {
      const cands = Array.from({length:12}, (_, i) => i).filter(i => !(i in known));
      let bestG = -1, gBest = [];
      cands.forEach(i => { if (gains[i] > bestG + 1e-12) { bestG = gains[i]; gBest = [i]; } else if (Math.abs(gains[i] - bestG) < 1e-9) gBest.push(i); });
      line = `容错还剩 ${(2 - sg) + (2 - sc)} 次，以命中为先：推荐 <span class="pill hit">${fmt(rec.list)}</span>（金 ${(p.pJ * 100).toFixed(1)}%，绿 ${(p.pL * 100).toFixed(1)}%，蓝 ${(p.pQ * 100).toFixed(1)}%）` +
             (gBest.length && !recSet.has(gBest[0]) ? `；信息最优备选：${fmt(gBest)}（熵减 ${bestG.toFixed(2)} bit）。` : `。`);
    }
  }
  $("adviceLine").innerHTML = line;

  let rows = `<tr><th>格</th><th>P（金）</th><th>P（绿）</th><th>P（蓝）</th><th>熵减</th></tr>`;
  for (let i = 0; i < 12; i++) {
    const v = probs[i], g = gains[i];
    const isRec = recSet.has(i);
    rows += `<tr class="${isRec ? "best" : ""}"><td>${i + 1}${known[i] ? "(" + NAMES[known[i].c] + ")" : ""}</td>` +
      (g !== null
        ? `<td>${(v.pJ * 100).toFixed(1)}%</td><td${sg >= 2 ? ' style="color:var(--red)"' : ""}>${(v.pL * 100).toFixed(1)}%</td><td${sc >= 2 ? ' style="color:var(--red)"' : ""}>${(v.pQ * 100).toFixed(1)}%</td><td>${g.toFixed(3)}</td></tr>`
        : `<td colspan="4">已知（${NAMES[known[i].c]}）</td></tr>`);
  }
  $("statsTable").innerHTML = rows;

  const bm = $("bannerMain"), err = $("bannerErr");
  bm.style.display = err.style.display = "none";
  const goldSets = new Set(alive.map(k => BOARDS[k].split("").map((c, i) => c === 'J' ? i : -1).filter(i => i >= 0).join(",")));
  if (conflict) {
    err.style.display = "block";
    err.innerHTML = `<b>矛盾：</b>当前已知与 138 种局面无匹配，请核对颜色是否记错。`;
  } else if (won) {
    bm.className = "banner ok";
    bm.style.display = "block";
    bm.innerHTML = `🎉 已找齐 3 金，本局通关！本局颜色已存入跨期档案。`;
  } else if (failed) {
    err.style.display = "block";
    err.innerHTML = `<b>本次抽奖失败：</b>开到了第 3 个${sg >= 3 ? "绿" : "蓝"}。已知颜色已存档，点「重置」开新一局。`;
  } else if (goldSets.size === 1) {
    const gs = [...goldSets][0].split(",").map(x => +x + 1);
    bm.className = "banner info";
    bm.style.display = "block";
    bm.innerHTML = `<b>金位已锁定：</b>${gs.join("、")} 号（${gs.filter(i => known[i - 1] && known[i - 1].c === 'J').length}/3 已翻开），按推荐顺序点完即可。`;
  }

  const hc = $("historyCard");
  if (order.length) {
    hc.style.display = "";
    $("chips").innerHTML = order.map(i =>
      `<span class="hchip"><i style="background:var(--${known[i].c==='J'?'gold':known[i].c==='L'?'green':'cyan'})"></i>` +
      `${i + 1} 号＝${NAMES[known[i].c]}<button onclick="removeStep(${i})" title="撤销">×</button></span>`).join("");
  } else hc.style.display = "none";

  $("nArch").textContent = archive.length;
  $("calNote").textContent = calOn
    ? (archive.length ? `已把 ${archive.length} 局档案并入开局先验。` : "校准已开：先玩出档案后生效。")
    : "";
  $("archList").innerHTML = archive.length ? archive.map(a => {
    const kn = Object.keys(a.k).length, nj = Object.values(a.k).filter(c => c === "J").length;
    return `<div class="arch-item">${miniHTML(a.k)}<span class="meta">${a.d} · 已知 ${kn} 格（金 ${nj}）</span></div>`;
  }).join("") : `<div style="font-size:12px;color:var(--muted);margin-top:8px">还没有档案——先玩一局，通关或失败都会自动存。</div>`;

  const sorted = alive.slice().sort((a, b) => w[b] - w[a]);
  $("minis").innerHTML = sorted.slice(0, 48).map(k =>
    `<div class="mini">${BOARDS[k].split("").map(c => `<b class="m${c}"></b>`).join("")}</div>`).join("") +
    (sorted.length > 48 ? `<div style="font-size:12px;color:var(--muted);align-self:center">…… 共 ${sorted.length} 种</div>` : "");
}

function feedback(c){
  if (selected === null) return;
  known[selected] = {c, src: "click"};
  if (!order.includes(selected)) order.push(selected);
  selected = null;
  render();
}
function closeBar(){ selected = null; render(); }
function removeStep(i){ delete known[i]; order = order.filter(x => x !== i); render(); }
function undoLast(){ if (order.length) removeStep(order[order.length - 1]); }
function resetAll(){ known = {}; order = []; selected = null; runSaved = false; render(); }

applyTheme();
loadArchive();
loadCal();
render();
</script>
